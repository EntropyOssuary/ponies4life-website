<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>🔒 Private</title>
<style>
  :root {
    --deep-teal: #0b4f5c;
    --teal: #0f7a8c;
    --aqua: #3fb8c4;
    --sand: #f6ede0;
    --coral: #e9714a;
    --ink: #1c2b2e;
    --muted: #5d6f72;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--sand);
    color: var(--ink);
  }
  .gate {
    background: #fff;
    border: 1px solid #e3ddd0;
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(11,79,92,0.1);
    padding: 40px 36px;
    max-width: 360px;
    width: 90%;
    text-align: center;
  }
  .gate .lock { font-size: 40px; margin-bottom: 12px; }
  .gate h1 { font-size: 18px; margin: 0 0 20px; color: var(--deep-teal); }
  .gate input {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-bottom: 14px;
  }
  .gate button {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: var(--teal);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .gate button:hover { background: var(--deep-teal); }
  .gate .error {
    color: var(--coral);
    font-size: 13.5px;
    margin-top: 12px;
    min-height: 18px;
  }
</style>
</head>
<body>

<div class="gate">
  <div class="lock">🔒</div>
  <h1>Enter password</h1>
  <form id="unlock-form">
    <input type="password" id="pw" autocomplete="current-password" autofocus>
    <button type="submit">Unlock</button>
  </form>
  <div class="error" id="err"></div>
</div>

function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function deriveKey(password, salt, iterations) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey(
    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
}

document.getElementById('unlock-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const salt = b64ToBytes(ENC.salt);
    const iv = b64ToBytes(ENC.iv);
    const data = b64ToBytes(ENC.data);
    const key = await deriveKey(pw, salt, ENC.iterations);
    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
    const html = new TextDecoder().decode(plainBuf);
    document.open();
    document.write(html);
    document.close();
  } catch (ex) {
    err.textContent = 'Incorrect password.';
  }
});
